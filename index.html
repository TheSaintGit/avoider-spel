<html lang="sv">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>

:root {
  --bg: #04050d;
  --fg: #e8f0ff;
  --cyan: #3ff3ff;
  --magenta: #ff3fb4;
  --violet: #8a6bff;
  --amber: #ffc23f;
  --font-display: "Quicksand", system-ui, sans-serif;
  color-scheme: dark;
}
html, body {
  height: 100%; margin: 0; background: var(--bg); color: var(--fg);
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  overscroll-behavior: none; -webkit-touch-callout: none;
}

#stage { position: fixed; inset: 0; background: var(--bg); touch-action: none; }
canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; background: var(--bg); }
#vig { position: fixed; pointer-events: none; }
#vig[hidden] { display: none; }
#sa { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
#rotate {
  position: fixed; inset: 0; flex-direction: column; gap: 18px;
  align-items: center; justify-content: center; text-align: center;
  background: var(--bg); color: var(--fg); font-family: var(--font-display);
  padding: 24px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px));
  z-index: 5;
}
#rotate .phone {
  width: 54px; height: 92px; border: 3px solid var(--cyan); border-radius: 10px;
  box-shadow: 0 0 18px var(--cyan); animation: turn 2s ease-in-out infinite;
}
#rotate p { margin: 0; font-size: 15px; letter-spacing: .08em; max-width: 26ch; line-height: 1.5; }
@keyframes turn { 0%, 30% { transform: rotate(0) } 60%, 100% { transform: rotate(-90deg) } }
#rotate { display: flex }
#rotate[hidden] { display: none }
#anyway {
  margin-top: 8px; padding: 10px 18px; font: 500 12px var(--font-display); letter-spacing: .08em;
  color: var(--cyan); background: transparent; border: 1px solid var(--cyan); border-radius: 6px;
}
#anyway:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
#styles {
  position: fixed; inset: 0; z-index: 6; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain;
  background: rgba(2, 8, 14, 0.94); color: #e8f4fa; font-family: var(--font-display);
  padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(16px, env(safe-area-inset-left, 0px));
}
#styles header { display: flex; align-items: center; gap: 16px; margin: 0 auto 14px; max-width: 980px; }
#styles h2 { margin: 0; font-size: 22px; letter-spacing: .04em; }
#styles header p { margin: 0; flex: 1; min-width: 0; font-size: 13px; color: #9fb7c4; line-height: 1.4; }
#styles-close { padding: 10px 22px; border-radius: 999px; border: 0; background: #e8f4fa; color: #04202b; font: 700 15px var(--font-display); cursor: pointer; }
#style-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; max-width: 980px; margin: 0 auto; }
#style-grid .card { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 14px; background: rgba(255,255,255,0.06); border: 2px solid transparent; min-width: 0; }
#style-grid .card.chosen { border-color: #5fe3f0; }
#style-grid .swatch { height: 70px; border-radius: 10px; }
#style-grid .locked .swatch { filter: grayscale(0.85) brightness(0.55); }
#style-grid .name { font-weight: 700; font-size: 15px; }
#style-grid .status { font-size: 12px; color: #9fb7c4; min-height: 2.6em; line-height: 1.3; }
#style-grid .btns { display: flex; gap: 6px; flex-wrap: wrap; }
#style-grid button { flex: 1; padding: 8px 10px; border-radius: 999px; border: 0; background: #5fe3f0; color: #04202b; font: 700 13px var(--font-display); cursor: pointer; }
#style-grid button.buy { background: transparent; color: #9fb7c4; border: 1px solid #4a6472; cursor: default; }
#style-grid .card.premium { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 14px; flex-wrap: wrap;
  background: linear-gradient(120deg, rgba(255,224,102,0.18), rgba(95,227,240,0.12)); border-color: rgba(255,224,102,0.55); }
#style-grid .card.premium .name { font-size: 18px; }
#style-grid .card.premium .txt { flex: 1; min-width: 200px; }
#style-grid .card.premium .status { min-height: 0; }
#style-grid .card.premium button { flex: 0 0 auto; background: #ffe066; padding: 10px 22px; font-size: 15px; }
#style-grid button.owned, #style-grid .card.premium button.owned { background: transparent; color: #ffe066; border: 1px solid rgba(255,224,102,0.5); cursor: default; }
#shop-modal { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; background: rgba(2,8,14,0.72); padding: 20px; }
#shop-modal[hidden] { display: none; }
#shop-modal .box { max-width: 420px; width: 100%; background: #0b2230; color: #e8f4fa; border-radius: 18px; padding: 18px 20px; border: 1px solid rgba(255,255,255,0.15); font-family: system-ui, sans-serif; }
#shop-modal h3 { margin: 0 0 8px; font-size: 18px; }
#shop-modal p { margin: 0 0 16px; font-size: 14px; line-height: 1.45; color: #c8dde6; }
#shop-modal .row { display: flex; gap: 10px; justify-content: flex-end; }
#shop-modal button { padding: 10px 18px; border-radius: 999px; border: 0; font: 700 14px system-ui, sans-serif; cursor: pointer; background: #ffe066; color: #04202b; }
#shop-modal button.alt { background: transparent; color: #c8dde6; border: 1px solid #4a6472; }
#set-list button { padding: 8px 16px; border-radius: 999px; border: 0; background: #e8f4fa; color: #04202b; font: 700 13px system-ui, sans-serif; cursor: pointer; }
#styles button:focus-visible { outline: 2px solid #ffe066; outline-offset: 2px; }

#settings {
  position: fixed; inset: 0; z-index: 6; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain;
  background: rgba(2, 8, 14, 0.94); color: #e8f4fa; font-family: var(--font-display);

}
#settings header { display: flex; align-items: center; gap: 16px; margin: 0 auto 10px; max-width: 640px; }
#settings h2 { margin: 0; flex: 1; font-size: 22px; letter-spacing: .04em; }
#settings-close { padding: 10px 22px; border-radius: 999px; border: 0; background: #e8f4fa; color: #04202b; font: 700 15px var(--font-display); cursor: pointer; }
#set-list { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
#set-list .row { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,0.06); }
#set-list .lbl { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; }
#set-list small { display: block; font-weight: 500; font-size: 12px; color: #9fb7c4; margin-top: 2px; line-height: 1.3; }
#set-list input[type=range] { width: min(38vw, 220px); accent-color: #5fe3f0; }
#set-list input[type=checkbox] { width: 26px; height: 26px; accent-color: #5fe3f0; }
#set-list select { max-width: 46vw; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.25); background: #0b2230; color: #e8f4fa; font: 600 14px system-ui, sans-serif; }
#set-list output { width: 7.5em; text-align: right; font-size: 13px; color: #c8dde6; }
#settings button:focus-visible, #set-list input:focus-visible { outline: 2px solid #ffe066; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-90deg) } }
